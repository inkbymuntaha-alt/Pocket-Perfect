name: Pocket Perfect gameplay smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gameplay-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local game server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pocket-perfect-server.log 2>&1 &
      - name: Run mobile gameplay smoke tests
        run: npx playwright test tests/gameplay.smoke.spec.js --reporter=line
